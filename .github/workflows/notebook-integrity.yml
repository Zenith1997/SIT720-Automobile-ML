name: Notebook structure check (no model training)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check notebook JSON and saved error outputs
        run: python check_notebook.py 'SIT720_6.1P_Linear_Logistic_Regression.ipynb'
